"14-932-683", "BrandDescription": "GIGABYTE", "SubCategoryDescription": "GPUs / Video Graphics Cards", "ItemDescription": "GIGABYTE GeForce RTX 4070 SUPER WINDFORCE OC 12G Graphics Card, 3x WINDFORCE Fans, 12GB 192-bit GDDR6X, GV-N407SWF3OC-12GD  Video Card", "ShowOEMMARK": false, "ShowOEMRetail": true, "HasVendorReplay": false, "LanguageCode": "en-US", "IsBuyer": false, "IsWrote": false, "ApproveStates": "Y", "BadgeList": null, "DisclaimerList": null, "ItemNumber": 12123827, "Rating": 4, "InDate": "2024-02-05T19:44:35.35", "Title": "Great Card with Caveats", "NickName": "Reviewer 1", "DisplayName": "Reviewer 1", "Comments": "Overall, this card provides great performance. This card was used in a Fractal Terra, so depending on the case and distance of the computer the fan ticking may be less of an issue for others. It seems to be a great fit for widescreen 1440p.", "Pros": "The card has great performance for widescreen 1440p. As a test, Remnant 2 with DLSS balanced maintains high framerates (140-160fps) on Ultra settings. The card clocks up to 2805MHz at its height. Fans can be loud, but do a good job keeping the card cool and under 70 for the most part.", "Cons": "This card was purchased as a replacement for a Windforce 4070 that had a fan bearing issue that caused a very a loud grinding/scraping sound. While this card is a major improvement, there is still an audible fan clicking/tapping sound that occurs mostly at low RPMs. It's not as bad, but the fact that it is still there with a second Windforce card tells me that it may be prevalent with Windforce fans. We managed tor reduce incidence by using a fan control curve that starts it at 50%, so unfortunately it starts louder than we'd like but it does *mostly* prevent the issue.\n\nWhile the Windforce 4070 was good in regards to coil whine, the Windforce 4070 Super we received definitely has coil whine during high framerate situations. In the case of testing with Remnant 2, it seems to be caused by DLSS (changing s
